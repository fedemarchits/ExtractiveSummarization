# Track C experiment settings - BillSum (original Track C prompts)

dataset:
  name: billsum
  silver_path: data/silver/billsum_silver.parquet
  train_silver_path: data/silver/billsum_train_silver.parquet

silver:
  # K derived from the BillSum compression ratio (scripts/compute_k.py),
  # not Track B's ACLSum value.
  best_heuristic_path: best_heuristic_billsum.json

fewshot:
  enabled: true
  shots_dir: data/shots
  n_shots: 1
  seed: 42

rationale:
  source_model: qwen35_397b
  cache_dir: data/shots/rationales/billsum_original
  max_exemplar_tries: 10
  max_new_tokens: 1024
  accept_f1: 0.7
  min_f1: 0.4

inference:
  max_new_tokens: 512
  temperature: 0.0
  seed: 42

self_consistency:
  enabled: false
  n_samples: 5
  temperature: 0.7

dynamic_capper:
  enabled: false

output:
  results_dir: results
  resume: true
