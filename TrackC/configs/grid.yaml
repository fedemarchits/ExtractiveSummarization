# # Which technique x variant cells run. "all" = the 4-cell full grid.
# # Restrict per technique with an explicit list of {shot, cap} pairs.
# # Techniques not listed default to the full grid.

techniques:
  vanilla: all
  least_to_most: all
  simulated_tool_augmented: all
  self_ask: all
  chain_of_thought: all
  explanation_based: all
  salience_inference: all
  self_critique: all
  contrastive_joint: all

  tool_augmented:
    - shot: zero_shot
      cap: capped

  tool_no_meta:
    - shot: zero_shot
      cap: capped

  tool_no_roleplay:
    - shot: zero_shot
      cap: capped

  scoring_based:
    - shot: zero_shot
      cap: uncapped

  scoring_no_length:
    - shot: zero_shot
      cap: uncapped

  scoring_no_redundancy:
    - shot: zero_shot
      cap: uncapped

  negative_aware:
    - shot: one_shot
      cap: uncapped
    - shot: one_shot
      cap: capped

  chain_of_thought_trace:
    - shot: one_shot
      cap: uncapped
    - shot: one_shot
      cap: capped

  self_ask_trace:
    - shot: one_shot
      cap: uncapped
    - shot: one_shot
      cap: capped

  scoring_based_trace:
    - shot: one_shot
      cap: uncapped
    - shot: one_shot
      cap: capped

  salience_inference_trace:
    - shot: one_shot
      cap: uncapped
    - shot: one_shot
      cap: capped

