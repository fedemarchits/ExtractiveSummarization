# Track C experiment settings - CNN/DailyMail

dataset:
  name: cnndm
  silver_path: data/silver/cnndm_silver.parquet
  train_silver_path: data/silver/cnndm_validation_silver.parquet

silver:
  best_heuristic_path: best_heuristic.json

fewshot:
  enabled: true
  shots_dir: data/shots
  n_shots: 1
  seed: 42

rationale:
  source_model: qwen35_397b
  cache_dir: data/shots/rationales/cnndm
  max_exemplar_tries: 10
  max_new_tokens: 1024
  accept_f1: 0.7
  min_f1: 0.4

inference:
  max_new_tokens: 512
  temperature: 0.0
  seed: 42

self_consistency:
  enabled: false
  n_samples: 5
  temperature: 0.7

dynamic_capper:
  enabled: false

output:
  results_dir: results
  resume: true

